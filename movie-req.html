<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Request | Dubflix Cinema</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#0d1117;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            color:#fff;
        }

        .container{
            width:500px;
            max-width:90%;
            background:#161b22;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 40px rgba(0,0,0,.5);
        }

        h1{
            text-align:center;
            color:#e50914;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#bbb;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
        }

        input, textarea, select{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            border-radius:8px;
            background:#222;
            color:#fff;
        }

        textarea{
            resize:none;
            height:120px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:15px;
            background:#e50914;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
            transition:.3s;
        }

        button:hover{
            background:#ff2938;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#fff;
            text-decoration:none;
        }

        .success{
            display:none;
            margin-top:20px;
            padding:12px;
            background:#0f5132;
            border-radius:8px;
            text-align:center;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>🎬 Movie Request</h1>

    <p>
        Can't find your favorite movie?<br>
        Request it below.
    </p>

    <form id="movieForm">

        <label>Movie Name</label>
        <input type="text" id="movie" required>

        <label>Language</label>
        <select id="language">
            <option>Tamil</option>
            <option>English</option>
            <option>Hindi</option>
            <option>Telugu</option>
            <option>Malayalam</option>
            <option>Kannada</option>
        </select>

        <label>Release Year</label>
        <input type="number" id="year">

        <label>Your Email (Optional)</label>
        <input type="email" id="email">

        <label>Message</label>
        <textarea id="message"></textarea>

        <button type="submit">
            Submit Request
        </button>

    </form>

    <div class="success" id="success">
        ✅ Your movie request has been submitted successfully!
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>
const form = document.getElementById("movieForm");

const WEB_APP_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const data = {
        movie: document.getElementById("movie").value,
        language: document.getElementById("language").value,
        year: document.getElementById("year").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
    };

    try{

        await fetch(WEB_APP_URL,{
            method:"POST",
            body:JSON.stringify(data)
        });

        document.getElementById("success").style.display="block";

        form.reset();

    }catch(error){

        alert("Failed to submit request.");

    }

});
</script>

</body>
</html>
